<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>29N · Gráficos para directo</title>
<!--
  Gráficos del 29N para capturar con OBS (fuente «Navegador», 1920 × 1080, fondo transparente).
  Leen el mismo fichero que la web (../data/vivo_29n.json) y se refrescan solos cada 15 s.

  Dirección: .../directo/?vista=VISTA[&opción=valor…]
    vista=faldon         barra inferior con carrusel de partidos (superpuesta sobre el plano de estudio)
    vista=columna        columna lateral con todos los partidos con escaño (superpuesta)
    vista=arco           pantalla completa: hemiciclo (fuera 2026, dentro 2023) y tabla
    vista=participacion  pantalla completa: constitución de mesas y avances de las 14:00 y las 18:00
    vista=provincia&provincia=28   pantalla completa: una provincia, con el último escaño
    vista=ticker         cinta inferior que corre con los escaños más disputados: las n=5 provincias donde a la
                         candidatura siguiente le faltan menos votos para quitar el último escaño (superpuesta).
                         minimo=50 (% escrutado de la provincia para entrar); velocidad=140 (píxeles por segundo)
    (piezas verticales para redes, en otra página: redes.html)
    vista=bucle          pantalla completa: todos los gráficos, uno tras otro (cada=12 segundos por gráfico;
                         vistas=arco,participacion,columna,faldon,provincia; provincias=28,08,46,41,29,48,50).
                         Antes del escrutinio solo alterna participación y faldón.
  Galería con miniaturas de todos: galeria.html
  Opciones:
    fondo=transparente | oscuro | blanco | croma   (por defecto: transparente en faldon/columna, oscuro en el resto;
                                            blanco = versión clara: fondo blanco, paneles claros y texto oscuro)
    lado=derecha         columna a la derecha            paso=6     segundos por página del carrusel
    datos=simulacro | demo                  para ensayar sin recuento real (último envío del simulacro de Interior)
  Logos: si existe logos/<ID>.png (PP.png, PSOE.png, VOX.png, FA.png…), se muestra en lugar del bloque de color.
-->
<style>
  :root { --tinta: #0d1320; --panel: rgba(13, 19, 32, .94); --panel2: rgba(255, 255, 255, .07); --texto: #fff;
          --tenue: rgba(255, 255, 255, .66); --acento: #19c37d; --sube: #3ddc84; --baja: #ff6b6b;
          --raya: rgba(255, 255, 255, .12); --pista: rgba(255, 255, 255, .12); --oro: #ffd166; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent;
               font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--texto);
               font-variant-numeric: tabular-nums; }
  body.fondo-oscuro { background: radial-gradient(1200px 700px at 30% 20%, #1b2740, #0a0f1a 70%); }
  body.fondo-croma { background: #00b140; }
  /* Versión clara (fondo=blanco): mismos gráficos con fondo blanco, paneles claros y texto oscuro. */
  body.fondo-blanco { background: #fff; --tinta: #fff; --panel: #f3f5f8; --panel2: rgba(13, 19, 32, .06); --texto: #0d1320;
                      --tenue: rgba(13, 19, 32, .62); --acento: #19c37d; --sube: #0a8a4a; --baja: #c62828;
                      --raya: rgba(13, 19, 32, .12); --pista: rgba(13, 19, 32, .1); --oro: #a85f00; }
  body.fondo-blanco #faldon .barra, body.fondo-blanco #columna .col, body.fondo-blanco #ticker .barra { box-shadow: 0 6px 24px rgba(13, 19, 32, .18); }
  body.fondo-blanco #faldon .pie { color: var(--texto); text-shadow: none; }
  body.fondo-blanco #participacion .av.pendiente .n { color: rgba(13, 19, 32, .22); }
  .vista { display: none; position: absolute; inset: 0; }
  body[data-vista="faldon"] #faldon, body[data-vista="columna"] #columna, body[data-vista="arco"] #arco,
  body[data-vista="participacion"] #participacion, body[data-vista="provincia"] #provincia,
  body[data-vista="ticker"] #ticker { display: block; }
  /* ---------- Ticker de escaños disputados ---------- */
  #ticker .barra { position: absolute; left: 0; right: 0; bottom: 48px; height: 92px; display: flex; background: var(--panel);
                   box-shadow: 0 12px 40px rgba(0, 0, 0, .45); }
  #ticker .cab { flex: none; display: flex; flex-direction: column; justify-content: center; padding: 0 34px; background: var(--acento);
                 color: #04150d; z-index: 1; box-shadow: 14px 0 22px rgba(0, 0, 0, .45); }
  #ticker .cab b { font-size: 27px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; line-height: 1.1; }
  #ticker .cab span { font-size: 17px; font-weight: 600; opacity: .8; }
  #ticker .cinta { flex: 1; overflow: hidden; }
  #ticker .rueda { display: inline-flex; height: 100%; align-items: center; white-space: nowrap; will-change: transform;
                   animation: corre 40s linear infinite; }
  #ticker .item { display: inline-flex; align-items: center; gap: 14px; padding: 0 46px; font-size: 30px; height: 100%;
                  border-right: 1px solid var(--raya); }
  #ticker .item .prov { font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
  #ticker .item .esc { font-size: 20px; color: var(--tenue); font-weight: 600; }
  #ticker .item i { width: 18px; height: 18px; border-radius: 5px; flex: none; }
  #ticker .item .t { color: var(--tenue); }
  #ticker .item .votos { font-weight: 800; color: var(--oro); }
  #ticker .aviso { padding: 0 46px; font-size: 28px; color: var(--tenue); align-self: center; }
  @keyframes corre { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .sello { font-size: 20px; font-weight: 800; letter-spacing: .12em; padding: 6px 14px; border-radius: 6px;
           background: #ffb020; color: #1a1300; }
  .delta { font-weight: 700; } .delta.sube { color: var(--sube); } .delta.baja { color: var(--baja); }
  .delta.igual { color: var(--tenue); }
  .logo { display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 800;
          color: #fff; overflow: hidden; flex: none; text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
  .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }

  /* ---------- Faldón ---------- */
  #faldon .barra { position: absolute; left: 60px; right: 60px; bottom: 54px; height: 150px; display: flex;
                   border-radius: 18px; overflow: hidden; background: var(--panel); box-shadow: 0 12px 40px rgba(0, 0, 0, .45); }
  #faldon .cab { width: 330px; flex: none; padding: 18px 26px; background: var(--acento); color: #04150d;
                 display: flex; flex-direction: column; justify-content: center; }
  #faldon .cab .t { font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  #faldon .cab .n { font-size: 58px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
  #faldon .cab .h { font-size: 18px; font-weight: 600; opacity: .8; }
  #faldon .pista { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); align-items: stretch; }
  #faldon .ficha { display: flex; align-items: center; gap: 16px; padding: 0 20px; border-left: 1px solid var(--raya);
                   animation: entra .5s ease both; min-width: 0; }
  #faldon .ficha .logo { width: 74px; height: 74px; font-size: 21px; }
  #faldon .ficha .nom { font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #faldon .ficha .esc { font-size: 50px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  #faldon .ficha .esc small { font-size: 22px; font-weight: 700; margin-left: 8px; }
  #faldon .ficha .pct { font-size: 19px; color: var(--tenue); }
  #faldon .pista.previa { grid-template-columns: repeat(3, 1fr); }
  #faldon .pista.previa .ficha { padding: 0 34px; } #faldon .pista.previa .ficha .esc { font-size: 54px; }
  #faldon .pie { position: absolute; right: 76px; bottom: 20px; font-size: 17px; color: #fff; opacity: .85;
                 text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
  @keyframes entra { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* ---------- Columna ---------- */
  #columna .col { position: absolute; top: 40px; bottom: 40px; left: 40px; width: 430px; border-radius: 18px;
                  background: var(--panel); box-shadow: 0 12px 40px rgba(0, 0, 0, .45); padding: 24px 22px;
                  display: flex; flex-direction: column; }
  body.lado-derecha #columna .col { left: auto; right: 40px; }
  #columna h1 { font-size: 26px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; }
  #columna h1 b { color: var(--acento); display: block; }
  #columna .escr { margin: 16px 0 14px; padding: 10px 16px; border-radius: 12px; background: var(--panel2);
                   display: flex; align-items: baseline; justify-content: space-between; }
  #columna .escr span { font-size: 18px; color: var(--tenue); font-weight: 600; }
  #columna .escr b { white-space: nowrap; margin-left: 10px; font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
  #columna .filas { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  #columna .fila { display: grid; grid-template-columns: 1fr 78px 62px; align-items: center; height: 50px; flex: none;
                   border-radius: 9px; padding: 0 14px; font-size: 24px; font-weight: 700; color: #fff; }
  #columna .fila .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
  #columna .fila .e { text-align: right; font-size: 30px; font-weight: 800; }
  #columna .fila .d { text-align: right; font-size: 19px; background: rgba(0, 0, 0, .28); border-radius: 6px;
                      padding: 4px 6px; margin-left: 8px; }
  #columna .filas .caja { flex: none; padding: 14px 18px; margin-bottom: 6px; } #columna .filas .caja b { font-size: 42px; }
  #columna .filas .vacio { font-size: 24px; margin-top: 14px; align-self: flex-start; }
  #columna .pie { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 700; }
  #columna .pie span { color: var(--tenue); font-weight: 600; }

  /* ---------- Pantallas completas ---------- */
  .lleno { padding: 56px 72px; display: grid; gap: 40px; height: 100%; }
  .titulo { display: flex; align-items: center; gap: 22px; }
  .titulo h1 { font-size: 46px; font-weight: 800; letter-spacing: -.01em; }
  .titulo h1 b { color: var(--acento); }
  .titulo .hora { margin-left: auto; font-size: 24px; color: var(--tenue); font-weight: 600; }
  .cajas { display: flex; gap: 18px; }
  .caja { flex: 1; background: var(--panel2); border-radius: 16px; padding: 18px 24px; }
  .caja b { display: block; font-size: 50px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .caja span { font-size: 21px; color: var(--tenue); font-weight: 600; }
  #arco .lleno { grid-template-columns: 1000px 1fr; grid-template-rows: auto 1fr; }
  #arco .titulo { grid-column: 1 / -1; }
  #arco .izq { display: flex; flex-direction: column; gap: 26px; min-height: 0; }
  #arco svg { width: 100%; height: auto; display: block; }
  .tabla { display: flex; flex-direction: column; gap: 9px; min-height: 0; overflow: hidden; }
  .tabla .f { display: grid; grid-template-columns: 62px 1fr 150px 130px; align-items: center; gap: 18px;
              background: var(--panel2); border-radius: 13px; padding: 9px 20px 9px 10px; flex: none; }
  .tabla .f .logo { width: 62px; height: 62px; font-size: 17px; }
  .tabla .f .nom { font-size: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabla .f .nom small { display: block; font-size: 19px; font-weight: 500; color: var(--tenue); }
  .tabla .f .pct { text-align: right; font-size: 27px; font-weight: 600; color: var(--tenue); }
  .tabla .f .esc { text-align: right; font-size: 48px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .tabla .f .esc small { display: block; font-size: 20px; margin-top: 3px; }
  .tabla.densa { gap: 6px; }
  .tabla.densa .f { padding: 4px 18px 4px 8px; grid-template-columns: 46px 1fr 150px 130px; }
  .tabla.densa .f .logo { width: 46px; height: 46px; font-size: 13px; border-radius: 8px; }
  .tabla.densa .f .nom { font-size: 25px; } .tabla.densa .f .nom small { font-size: 15px; }
  .tabla.densa .f .pct { font-size: 23px; } .tabla.densa .f .esc { font-size: 36px; }
  .tabla.densa .f .esc { white-space: nowrap; } .tabla.densa .f .esc small { display: inline; font-size: 19px; margin: 0 0 0 10px; }
  .tabla.densa .f .esc .vs { display: none; }
  #participacion .lleno { grid-template-rows: auto 1fr auto; }
  #participacion .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: stretch; }
  #participacion .av { background: var(--panel2); border-radius: 24px; padding: 40px 48px; display: flex; flex-direction: column; justify-content: center; }
  #participacion .av .h { font-size: 34px; font-weight: 700; color: var(--tenue); }
  #participacion .av .n { font-size: 190px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  #participacion .av .n small { font-size: 80px; }
  #participacion .av .b { height: 22px; border-radius: 11px; background: var(--pista); margin-top: 26px; overflow: hidden; }
  #participacion .av .b i { display: block; height: 100%; background: var(--acento); border-radius: 11px; }
  #participacion .av .cmp { font-size: 34px; font-weight: 600; margin-top: 26px; min-height: 48px; }
  #participacion .av .ref { font-size: 26px; color: var(--tenue); margin-top: 8px; }
  #participacion .av.pendiente .n { color: rgba(255, 255, 255, .25); }
  #provincia .lleno { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr; }
  #provincia .titulo, #provincia .ultimo { grid-column: 1 / -1; }
  #provincia .ultimo { background: var(--acento); color: #04150d; border-radius: 16px; padding: 20px 28px; font-size: 32px; font-weight: 600; }
  #provincia .ultimo b { font-weight: 800; }
  .vacio { font-size: 34px; color: var(--tenue); font-weight: 600; align-self: center; }
</style>
</head>
<body>

<section id="faldon" class="vista">
  <div class="barra">
    <div class="cab"><div class="t" id="f-t">Escrutado</div><div class="n" id="f-n">—</div><div class="h" id="f-h"></div></div>
    <div class="pista" id="f-pista"></div>
  </div>
  <div class="pie" id="f-pie"></div>
</section>

<section id="columna" class="vista">
  <div class="col">
    <h1>Elecciones <b>generales</b></h1>
    <div class="escr"><span id="c-t">Escrutado</span><b id="c-n">—</b></div>
    <div class="filas" id="c-filas"></div>
    <div class="pie"><div id="c-pie">Mayoría absoluta 176</div><span id="c-h"></span></div>
  </div>
</section>

<section id="arco" class="vista">
  <div class="lleno">
    <div class="titulo"><h1>Elecciones generales <b>29N</b></h1><span class="sello" id="a-sello" hidden>SIMULACRO</span><span class="hora" id="a-h"></span></div>
    <div class="izq"><div id="a-svg"></div><div class="cajas" id="a-cajas"></div></div>
    <div class="tabla" id="a-tabla"></div>
  </div>
</section>

<section id="participacion" class="vista">
  <div class="lleno">
    <div class="titulo"><h1>Participación <b>29N</b></h1><span class="sello" id="p-sello" hidden>SIMULACRO</span><span class="hora" id="p-h"></span></div>
    <div class="dos" id="p-dos"></div>
    <div class="cajas" id="p-cajas"></div>
  </div>
</section>

<section id="ticker" class="vista">
  <div class="barra">
    <div class="cab"><b>Escaños en el aire</b><span id="t-h"></span></div>
    <div class="cinta" id="t-cinta"></div>
  </div>
</section>

<section id="provincia" class="vista">
  <div class="lleno">
    <div class="titulo"><h1 id="v-titulo"></h1><span class="sello" id="v-sello" hidden>SIMULACRO</span><span class="hora" id="v-h"></span></div>
    <div class="ultimo" id="v-ultimo" hidden></div>
    <div class="tabla" id="v-tabla"></div>
    <div class="izq"><div class="cajas" id="v-cajas" style="flex-direction:column"></div></div>
  </div>
</section>

<script>
const Q = new URLSearchParams(location.search);
const TODAS = ["arco", "participacion", "columna", "faldon", "provincia"];
const BUCLE = Q.get("vista") === "bucle";
const VISTAS = (Q.get("vistas") || TODAS.join(",")).split(",").filter((v) => TODAS.includes(v) || v === "ticker");
const PROVS = (Q.get("provincias") || "28,08,46,41,29,48,50").split(",");
let VISTA = BUCLE ? VISTAS[0] || "arco" : Q.get("vista") || "arco";
let PROV = Q.get("provincia") || PROVS[0];
const SUPERPUESTA = !BUCLE && ["faldon", "columna", "ticker"].includes(VISTA);
document.body.dataset.vista = VISTA;
document.body.classList.add("fondo-" + (Q.get("fondo") || (SUPERPUESTA ? "transparente" : "oscuro")));
if (Q.get("lado") === "derecha") document.body.classList.add("lado-derecha");
const ORIGEN = { simulacro: "../data/simulacro_29n.json", demo: "../data/demo_29n.json" }[Q.get("datos")] || "../data/vivo_29n.json";
const PASO = 1000 * Math.max(3, Number(Q.get("paso")) || 6);

const NOMBRE = { PP: "PP", PSOE: "PSOE", VOX: "Vox", FA: "Frente Amplio", PODEMOS: "Podemos", SALF: "SALF", ERC: "ERC",
  JUNTS: "Junts", EH_BILDU: "EH Bildu", PNV: "PNV", BNG: "BNG", CC: "Coalición Canaria", COMPROMIS: "Compromís",
  NC: "NC-Podemos-IU", ADELANTE: "Adelante And.", TERUEL_EXISTE: "Teruel Existe", GBAI: "Geroa Bai", PACMA: "PACMA" };
const CORTO = { PP: "PP", PSOE: "PSOE", VOX: "VOX", FA: "FA", PODEMOS: "POD", SALF: "SALF", ERC: "ERC", JUNTS: "JUNTS",
  EH_BILDU: "BILDU", PNV: "PNV", BNG: "BNG", CC: "CC", COMPROMIS: "COMP", NC: "NC", ADELANTE: "ADEL", TERUEL_EXISTE: "TE", GBAI: "GBAI", PACMA: "PACMA" };
const COLOR = { PP: "#1D84CE", PSOE: "#E30713", VOX: "#5BA82B", FA: "#E51C55", PODEMOS: "#6B2E7A", SALF: "#7A5230",
  ERC: "#E0A020", JUNTS: "#00A99D", EH_BILDU: "#7BA21A", PNV: "#0F6B3C", BNG: "#5F93C0", CC: "#C9A400", COMPROMIS: "#D96A2B",
  NC: "#3C8D5A", ADELANTE: "#2AA198", TERUEL_EXISTE: "#4B6B4F", GBAI: "#B0333A", PACMA: "#9BB52B" };
// Reparto oficial de 2023 (anillo interior y comparación). PP incluye el escaño de UPN, hoy en coalición.
// Avances de participación de las dos generales anteriores (Interior, vía la tabla de Wikipedia; ver escrutinio_29n.py).
const AV_PREVIOS = [{ 2023: 40.48, 2019: 37.92 }, { 2023: 53.12, 2019: 56.86 }];
const E2023 = { PP: 138, PSOE: 121, VOX: 33, ERC: 7, JUNTS: 7, EH_BILDU: 6, PNV: 5, BNG: 1, CC: 1 };
// Escaños de 2023 por provincia de los espacios con continuidad (de web/data/resultados.json; PP incluye UPN).
const E2023_PROV = {"01":{"PSOE":1,"EH_BILDU":1,"PP":1,"PNV":1},"02":{"PP":2,"PSOE":2},"03":{"PP":5,"PSOE":4,"VOX":2},"04":{"PP":3,"PSOE":2,"VOX":1},"05":{"PP":2,"PSOE":1},"06":{"PSOE":2,"PP":2,"VOX":1},"07":{"PP":3,"PSOE":3,"VOX":1},"08":{"PSOE":13,"PP":5,"ERC":4,"JUNTS":3,"VOX":2},"09":{"PP":2,"PSOE":2},"10":{"PSOE":2,"PP":2},"11":{"PP":4,"PSOE":3,"VOX":1},"12":{"PP":2,"PSOE":2,"VOX":1},"13":{"PP":2,"PSOE":2,"VOX":1},"14":{"PP":2,"PSOE":2,"VOX":1},"15":{"PP":4,"PSOE":2,"BNG":1},"16":{"PP":2,"PSOE":1},"17":{"PSOE":2,"JUNTS":2,"ERC":1},"18":{"PP":3,"PSOE":2,"VOX":1},"19":{"PP":1,"PSOE":1,"VOX":1},"20":{"EH_BILDU":2,"PSOE":2,"PNV":2},"21":{"PP":2,"PSOE":2,"VOX":1},"22":{"PP":2,"PSOE":1},"23":{"PP":2,"PSOE":2,"VOX":1},"24":{"PP":2,"PSOE":2},"25":{"PSOE":2,"ERC":1,"JUNTS":1},"26":{"PP":2,"PSOE":2},"27":{"PP":3,"PSOE":1},"28":{"PP":16,"PSOE":10,"VOX":5},"29":{"PP":5,"PSOE":3,"VOX":2},"30":{"PP":4,"PSOE":3,"VOX":2},"31":{"PSOE":2,"EH_BILDU":1,"PP":2},"32":{"PP":3,"PSOE":1},"33":{"PP":3,"PSOE":2,"VOX":1},"34":{"PP":2,"PSOE":1},"35":{"PSOE":3,"PP":3,"VOX":1},"36":{"PP":3,"PSOE":3},"37":{"PP":3,"PSOE":1},"38":{"PP":3,"PSOE":3,"CC":1},"39":{"PP":2,"PSOE":2,"VOX":1},"40":{"PP":2,"PSOE":1},"41":{"PSOE":5,"PP":4,"VOX":1},"42":{"PP":1,"PSOE":1},"43":{"PSOE":2,"ERC":1,"PP":1,"JUNTS":1},"44":{"PP":2,"PSOE":1},"45":{"PP":3,"PSOE":2,"VOX":1},"46":{"PP":6,"PSOE":5,"VOX":2},"47":{"PP":2,"PSOE":2,"VOX":1},"48":{"PNV":2,"PSOE":2,"EH_BILDU":2,"PP":1},"49":{"PP":2,"PSOE":1},"50":{"PP":3,"PSOE":2,"VOX":1},"51":{"PP":1},"52":{"PP":1}};
const ARCO2023 = [["PP", 138], ["PSOE", 121], ["VOX", 33], ["SUMAR", 31], ["ERC", 7], ["JUNTS", 7], ["EH_BILDU", 6], ["PNV", 5], ["BNG", 1], ["CC", 1]];
const col = (f) => COLOR[f] || (f === "SUMAR" ? "#E51C55" : "#8D98A6");
const nom = (p) => NOMBRE[p.f] || p.s;
const $ = (s) => document.querySelector(s);
const num = (x) => Math.round(x).toLocaleString("es-ES", { useGrouping: "always" });
const dec = (x, d = 1) => Number(x).toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt !== undefined) n.textContent = txt; return n; };

function logo(p) {
  const d = el("span", "logo", CORTO[p.f] || p.s.slice(0, 5));
  d.style.background = col(p.f);
  const id = p.f !== "OTROS" ? p.f : null;
  if (id) {
    const img = new Image();
    img.onload = () => { d.textContent = ""; d.appendChild(img); };
    img.src = `logos/${id}.png`;
    img.alt = nom(p);
  }
  return d;
}
function delta(p, antes) {
  // Con `antes` (una provincia): los espacios con continuidad que no tuvieron escaño allí se comparan con 0.
  const base = antes ? (E2023[p.f] === undefined ? undefined : antes[p.f] || 0) : E2023[p.f];
  // En el total nacional no se compara mientras queden escaños sin asignar (provincias sin recuento): «PSOE 52, −69» engañaría.
  if (base === undefined || (!antes && !repartoCompleto())) return null;
  const d = p.e - base;
  return el("span", "delta " + (d > 0 ? "sube" : d < 0 ? "baja" : "igual"), d > 0 ? `+${d}` : d < 0 ? `−${-d}` : "=");
}
const repartoCompleto = () => D.nacional.partidos.reduce((t, p) => t + p.e, 0) >= D.nacional.escanos_total;
const conEscano = (a) => [...a.partidos].sort((x, y) => y.e - x.e || y.v - x.v);

let D = null, pagina = 0, firma = "";

function hemiciclo(a) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 1000 540");
  const arco = (r1, r2, a0, a1) => {
    const pt = (r, x) => `${500 - r * Math.cos(x)},${510 - r * Math.sin(x)}`;
    return `M${pt(r2, a0)}A${r2},${r2} 0 0 1 ${pt(r2, a1)}L${pt(r1, a1)}A${r1},${r1} 0 0 0 ${pt(r1, a0)}Z`;
  };
  const css = getComputedStyle(document.body), T = (v) => css.getPropertyValue(v).trim();
  const TEXTO = T("--texto") || "#fff", TENUE = T("--tenue") || "rgba(255,255,255,.66)", TINTA = T("--tinta") || "#0d1320", PISTA = T("--pista") || "rgba(255,255,255,.1)";
  const texto = (x, y, t, tam, peso, relleno) => {
    const n = document.createElementNS(NS, "text");
    n.setAttribute("x", x); n.setAttribute("y", y); n.setAttribute("text-anchor", "middle");
    n.setAttribute("font-size", tam); n.setAttribute("font-weight", peso); n.setAttribute("fill", relleno || "#fff");
    n.textContent = t; svg.appendChild(n);
  };
  const anillo = (lista, r1, r2, opacidad) => {
    let acum = 0;
    if (!lista.length) {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", arco(r1, r2, 0, Math.PI)); p.setAttribute("fill", PISTA); svg.appendChild(p);
    }
    lista.forEach(([f, e]) => {
      const a0 = Math.PI * acum / 350, a1 = Math.PI * (acum + e) / 350;
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", arco(r1, r2, a0, a1)); p.setAttribute("fill", col(f)); p.setAttribute("opacity", opacidad);
      p.setAttribute("stroke", TINTA); p.setAttribute("stroke-width", "2"); svg.appendChild(p);
      if (e >= 14) { const m = (a0 + a1) / 2, r = (r1 + r2) / 2; texto(500 - r * Math.cos(m), 510 - r * Math.sin(m) + 12, e, r2 - r1 > 100 ? 40 : 28, 800); }
      acum += e;
    });
    // Escaños aún sin asignar (provincias sin recuento): el resto del arco, en gris, con su cifra.
    if (lista.length && acum < 350) {
      const a0 = Math.PI * acum / 350, p = document.createElementNS(NS, "path");
      p.setAttribute("d", arco(r1, r2, a0, Math.PI)); p.setAttribute("fill", PISTA); svg.appendChild(p);
      if (350 - acum >= 30) {
        const m = (a0 + Math.PI) / 2, r = (r1 + r2) / 2;
        texto(500 - r * Math.cos(m), 510 - r * Math.sin(m), 350 - acum, 34, 800, TENUE);
        texto(500 - r * Math.cos(m), 510 - r * Math.sin(m) + 26, "sin asignar", 19, 600, TENUE);
      }
    }
  };
  anillo(conEscano(a).filter((p) => p.e > 0).map((p) => [p.f, p.e]), 330, 490, 1);
  anillo(ARCO2023, 205, 305, .8);
  const l = document.createElementNS(NS, "line");
  l.setAttribute("x1", 500); l.setAttribute("x2", 500); l.setAttribute("y1", 8); l.setAttribute("y2", 310);
  l.setAttribute("stroke", TEXTO); l.setAttribute("stroke-width", 3); l.setAttribute("stroke-dasharray", "8 6"); svg.appendChild(l);
  texto(500, 440, "Mayoría absoluta", 26, 600, TENUE);
  texto(500, 500, "176", 60, 800, TEXTO);
  texto(72, 536, "2026", 22, 700, TENUE);
  texto(250, 536, "2023", 22, 700, TENUE);
  return svg;
}

function tabla(cont, a, antes, max) {
  cont.replaceChildren();
  const lista = conEscano(a).filter((p) => p.e > 0 || p.v >= 0.02 * a.validos).slice(0, max);
  cont.classList.toggle("densa", lista.length > 9);      // con más de nueve filas se aprietan para que quepan todas
  if (!lista.length) { cont.appendChild(el("div", "vacio", "Todavía no hay votos contados.")); return; }
  lista.forEach((p) => {
    const f = el("div", "f");
    const n = el("div", "nom", nom(p));
    n.appendChild(el("small", null, num(p.v) + " votos"));
    const e = el("div", "esc", String(p.e));
    const d = delta(p, antes); if (d) { const s = el("small"); s.appendChild(d); s.appendChild(el("span", "vs", " vs 2023")); e.appendChild(s); }
    f.append(logo(p), n, el("div", "pct", dec(100 * p.v / a.validos, 1) + " %"), e);
    cont.appendChild(f);
  });
}
function cajas(cont, datos) {
  cont.replaceChildren();
  datos.forEach(([v, t]) => { const c = el("div", "caja"); c.append(el("b", null, v), el("span", null, t)); cont.appendChild(c); });
}

// Antes del escrutinio: mesas constituidas y avances de participación (lo que haya llegado), como pares [valor, rótulo].
function previa(a) {
  const m = a.mesas || {}, av = a.avances || [];
  return [[m.total ? dec(100 * m.constituidas / m.total, 1) + " %" : "—", "mesas constituidas"],
          [av[0] > 0 ? dec(av[0], 2) + " %" : "—", "participación a las 14:00"], [av[1] > 0 ? dec(av[1], 2) + " %" : "—", "participación a las 18:00"]];
}
function pintarFaldon() {
  const a = D.nacional, hay = a.escrutado > 0, av = a.avances || [];
  if (hay) { $("#f-t").textContent = "Escrutado"; $("#f-n").textContent = dec(a.escrutado, 1) + " %"; }
  else if (av[1] > 0 || av[0] > 0) { $("#f-t").textContent = "Participación " + (av[1] > 0 ? "18:00" : "14:00"); $("#f-n").textContent = dec(av[1] > 0 ? av[1] : av[0], 1) + " %"; }
  else { $("#f-t").textContent = "Elecciones 29N"; $("#f-n").textContent = "20:00"; }
  $("#f-h").textContent = hay && D.hora ? "Actualizado a las " + D.hora : hay ? "" : av[0] > 0 ? "Fuente: Ministerio del Interior" : "Inicio del escrutinio";
  const lista = conEscano(a).filter((p) => p.e > 0 || p.v >= 0.02 * a.validos);
  const pista = $("#f-pista");
  pista.replaceChildren();
  const paginas = Math.max(1, Math.ceil(lista.length / 5));
  lista.slice((pagina % paginas) * 5, (pagina % paginas) * 5 + 5).forEach((p, i) => {
    const f = el("div", "ficha"); f.style.animationDelay = i * 70 + "ms";
    const t = el("div");
    const e = el("div", "esc", String(p.e));
    const d = delta(p); if (d) { const s = el("small"); s.appendChild(d); e.appendChild(s); }
    t.append(el("div", "nom", nom(p)), e, el("div", "pct", dec(100 * p.v / a.validos, 1) + " % de voto"));
    f.append(logo(p), t);
    pista.appendChild(f);
  });
  if (!lista.length && !hay) {            // sin recuento: la barra enseña la participación comparada con 2023
    pista.classList.add("previa");
    const m = a.mesas || {};
    [["Mesas constituidas", m.total ? dec(100 * m.constituidas / m.total, 1) + " %" : "—", m.total ? num(m.total) + " mesas" : ""],
     ["Participación a las 14:00", av[0] > 0 ? dec(av[0], 2) + " %" : "—", av[0] > 0 ? AV_PREVIOS[0][2023] : null],
     ["Participación a las 18:00", av[1] > 0 ? dec(av[1], 2) + " %" : "—", av[1] > 0 ? AV_PREVIOS[1][2023] : null]].forEach(([t, v, ref], k) => {
      const f = el("div", "ficha"), c = el("div");
      const pie = el("div", "pct");
      if (typeof ref === "number") {
        const d = (k === 1 ? av[0] : av[1]) - ref;
        pie.append(el("span", "delta " + (d > 0 ? "sube" : d < 0 ? "baja" : "igual"), (d > 0 ? "▲ " : d < 0 ? "▼ " : "= ") + dec(Math.abs(d), 2)), ` puntos · en 2023, ${dec(ref, 2)} %`);
      } else pie.textContent = ref || (k ? "pendiente" : "");
      c.append(el("div", "nom", t), el("div", "esc", v), pie);
      f.appendChild(c); pista.appendChild(f);
    });
  } else { pista.classList.remove("previa"); if (!lista.length) pista.appendChild(el("div", "ficha", "")); }
  $("#f-pie").textContent = (D.simulacro ? "SIMULACRO · " : "") + (hay ? (repartoCompleto() ? "Escaños · mayoría absoluta 176 · " : `Escaños asignados: ${a.partidos.reduce((t, p) => t + p.e, 0)} de 350 · `) + (paginas > 1 ? `${pagina % paginas + 1}/${paginas} · ` : "") : "") + "Fuente: Ministerio del Interior";
}
function pintarColumna() {
  const a = D.nacional;
  const hay = a.escrutado > 0, av = a.avances || [];
  $("#c-t").textContent = (D.simulacro ? "Simulacro · " : "") + (hay ? "escrutado" : av[1] > 0 ? "participación 18:00" : av[0] > 0 ? "participación 14:00" : "escrutado");
  $("#c-n").textContent = hay ? dec(a.escrutado, 2) + " %" : av[1] > 0 ? dec(av[1], 2) + " %" : av[0] > 0 ? dec(av[0], 2) + " %" : "0,00 %";
  $("#c-h").textContent = hay ? D.hora || "" : "";        // antes del escrutinio Interior manda la fecha sin hora («00:00»)
  const cont = $("#c-filas");
  cont.replaceChildren();
  const libres = a.escanos_total - a.partidos.reduce((t, p) => t + p.e, 0);
  $("#c-pie").textContent = hay && libres > 0 ? `${libres} escaños sin asignar` : "Mayoría absoluta 176";
  conEscano(a).filter((p) => p.e > 0).slice(0, 15).forEach((p) => {
    const f = el("div", "fila"); f.style.background = col(p.f);
    const d = delta(p);
    const dd = el("div", "d"); if (d) { d.className = "delta"; dd.appendChild(d); } else dd.style.visibility = "hidden";
    if (!repartoCompleto()) dd.style.display = "none";
    f.append(el("div", "n", nom(p)), el("div", "e", String(p.e)), dd);
    cont.appendChild(f);
  });
  if (!cont.children.length) {
    previa(a).forEach(([v, t]) => { const c = el("div", "caja"); c.append(el("b", null, v), el("span", null, t)); cont.appendChild(c); });
    cont.appendChild(el("div", "vacio", "El escrutinio empieza a las 20:00"));
  }
}
function pintarArco() {
  const a = D.nacional;
  $("#a-sello").hidden = !D.simulacro;
  $("#a-h").textContent = a.escrutado > 0 && D.hora ? "Actualizado a las " + D.hora : "";
  $("#a-svg").replaceChildren(hemiciclo(a));
  cajas($("#a-cajas"), a.escrutado > 0 ? [[dec(a.escrutado, 2) + " %", "escrutado"], [dec(a.participacion_residentes, 2) + " %", "participación"],
                        [num(a.validos), "votos válidos"]] : previa(a));
  tabla($("#a-tabla"), a, null, 14);
}
function pintarParticipacion() {
  const a = D.nacional, av = a.avances || [0, 0];
  $("#p-sello").hidden = !D.simulacro;
  $("#p-h").textContent = "Fuente: Ministerio del Interior";
  const cont = $("#p-dos");
  cont.replaceChildren();
  [["Avance de las 14:00", av[0]], ["Avance de las 18:00", av[1]]].forEach(([t, v], k) => {
    const c = el("div", "av" + (v > 0 ? "" : " pendiente"));
    const n = el("div", "n", v > 0 ? dec(v, 1) : "– –"); if (v > 0) n.appendChild(el("small", null, " %"));
    const b = el("div", "b"); const i = el("i"); i.style.width = Math.min(100, v || 0) + "%"; b.appendChild(i);
    const cmp = el("div", "cmp"), antes = AV_PREVIOS[k];
    if (v > 0) {
      const d = v - antes[2023];
      cmp.append(el("span", "delta " + (d > 0 ? "sube" : d < 0 ? "baja" : "igual"), (d > 0 ? "▲ " : d < 0 ? "▼ " : "= ") + dec(Math.abs(d), 2) + " puntos"), " respecto a 2023");
    }
    const ref = el("div", "ref", `Julio de 2023: ${dec(antes[2023], 2)} %  ·  Noviembre de 2019: ${dec(antes[2019], 2)} %`);
    c.append(el("div", "h", t), n, b, cmp, ref);
    cont.appendChild(c);
  });
  const m = a.mesas || {};
  cajas($("#p-cajas"), [[m.total ? dec(100 * m.constituidas / m.total, 1) + " %" : "—", "mesas constituidas"],
                        [m.total ? num(m.total) : "—", "mesas electorales"], [a.censo ? num(a.censo) : "—", "electores"]]);
}
function pintarProvincia() {
  const cod = PROV, a = D.provincias[cod];
  if (!a) return;
  $("#v-sello").hidden = !D.simulacro;
  $("#v-titulo").replaceChildren(a.nombre + " ", el("b", null, a.escanos_total + " escaños"));
  $("#v-h").textContent = a.escrutado > 0 && D.hora ? "Actualizado a las " + D.hora : "";
  const u = $("#v-ultimo");
  u.hidden = !(a.escrutado > 0 && a.ultimo && Number(a.ultimo.ultima) > 0);
  if (!u.hidden) {
    const sig = (c) => { const p = a.partidos.find((x) => Number(x.c) === Number(c)); return p ? nom(p) : "otra candidatura"; };
    u.replaceChildren(el("b", null, "Último escaño: "), sig(a.ultimo.ultima) + ". ");
    if (Number(a.ultimo.proxima) > 0) u.append("El siguiente sería para ", el("b", null, sig(a.ultimo.proxima)), `, a ${num(a.ultimo.faltan)} votos.`);
  }
  tabla($("#v-tabla"), a, E2023_PROV[cod] || {}, 9);
  cajas($("#v-cajas"), [[dec(a.escrutado, 2) + " %", "escrutado"], [a.escrutado > 0 ? dec(a.participacion_residentes, 2) + " %" : "—", "participación"],
                        [num(a.validos), "votos válidos"]]);
}
/* Escaños más disputados: provincias donde a la siguiente candidatura le faltan menos votos para el último escaño.
   Los votos que faltan los da Interior sobre lo contado hasta ese envío; para que no ganen siempre las provincias con
   poco recuento se exige un mínimo escrutado y se ordena por los votos que faltarían al 100 % a este ritmo. */
function disputados(n, minimo) {
  return Object.values(D.provincias)
    .filter((a) => a.escrutado >= minimo && a.escrutado > 0 && a.ultimo && Number(a.ultimo.ultima) > 0 && Number(a.ultimo.proxima) > 0 && a.ultimo.faltan > 0)
    .sort((x, y) => x.ultimo.faltan / x.escrutado - y.ultimo.faltan / y.escrutado)
    .slice(0, n);
}
function pintarTicker() {
  const n = Math.max(1, Number(Q.get("n")) || 5), minimo = Q.has("minimo") ? Number(Q.get("minimo")) : 50;
  const cinta = $("#t-cinta"), lista = disputados(n, minimo);
  $("#t-h").textContent = (D.simulacro ? "SIMULACRO · " : "") + (D.hora && D.nacional.escrutado > 0 ? "Datos de las " + D.hora : "Último escaño de cada provincia");
  cinta.replaceChildren();
  if (!lista.length) { cinta.appendChild(el("div", "aviso", D.nacional.escrutado > 0 ? "Aún no hay provincias con recuento suficiente." : "El escrutinio empieza a las 20:00.")); cinta.style.display = "flex"; return; }
  cinta.style.display = "";
  const rueda = el("div", "rueda");
  const punto = (p) => { const i = el("i"); i.style.background = p ? col(p.f) : "#8D98A6"; return i; };
  for (let vuelta = 0; vuelta < 2; vuelta++) lista.forEach((a) => {       // dos copias seguidas: la cinta gira sin corte
    const de = (c) => a.partidos.find((x) => Number(x.c) === Number(c));
    const u = de(a.ultimo.ultima), s = de(a.ultimo.proxima);
    const it = el("span", "item");
    it.append(el("span", "prov", a.nombre), el("span", "esc", dec(a.escrutado, 1) + " % escrutado"),
      el("span", "t", "último escaño:"), punto(u), el("b", null, u ? nom(u) : "otra candidatura"),
      el("span", "t", "· se lo quitaría"), punto(s), el("b", null, s ? nom(s) : "otra candidatura"),
      el("span", "t", "con"), el("span", "votos", num(a.ultimo.faltan) + " votos más"));
    rueda.appendChild(it);
  });
  cinta.appendChild(rueda);
  rueda.style.animationDuration = Math.max(10, rueda.scrollWidth / 2 / Math.max(40, Number(Q.get("velocidad")) || 140)) + "s";
}
const PINTAR = { ticker: pintarTicker, faldon: pintarFaldon, columna: pintarColumna, arco: pintarArco, participacion: pintarParticipacion, provincia: pintarProvincia };

function mostrar() { document.body.dataset.vista = VISTA; (PINTAR[VISTA] || pintarArco)(); }
// Bucle: pasa al gráfico siguiente. Sin escrutinio solo tienen contenido la participación y el faldón.
let paso = 0, vueltaProv = 0;
function siguiente() {
  if (!D) return;
  const hay = D.nacional.escrutado > 0;
  const lista = VISTAS.filter((v) => hay || v === "participacion" || v === "faldon");
  if (!lista.length) return;
  paso++;
  VISTA = lista[paso % lista.length];
  if (VISTA === "provincia") PROV = PROVS[vueltaProv++ % PROVS.length];
  if (VISTA === "faldon") pagina++;
  mostrar();
}
async function cargar() {
  try {
    const r = await fetch(ORIGEN, { cache: "no-store" });
    if (!r.ok) return;
    const txt = await r.text();
    if (txt === firma) return;          // sin cambios: no se repinta (evita parpadeos en emisión)
    firma = txt; D = JSON.parse(txt);
    mostrar();
  } catch (e) { /* se mantiene lo último que se pintó */ }
}
cargar();
setInterval(cargar, 15000);
if (BUCLE) setInterval(siguiente, 1000 * Math.max(4, Number(Q.get("cada")) || 12));
else if (VISTA === "faldon") setInterval(() => { if (D) { pagina++; pintarFaldon(); } }, PASO);
</script>
